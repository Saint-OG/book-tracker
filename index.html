<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Book Tracker</title>
  <style>
    body { font-family: sans-serif; max-width: 480px; margin: 2rem auto; padding: 0 1rem; }
    input, button { padding: 0.5rem; margin: 0.25rem 0; width: 100%; box-sizing: border-box; }
    button { cursor: pointer; }
    .hidden { display: none; }
    #message { font-weight: bold; min-height: 1.5rem; }
    #book-list { padding-left: 1.2rem; }
    #book-list li { margin: 0.5rem 0; }
    #book-list button { width: auto; margin-left: 0.5rem; padding: 0.25rem 0.5rem; }
  </style>
</head>
<body>
  <h1>Book Tracker</h1>
  <p id="message"></p>

  <div id="auth-section">
    <input id="username" placeholder="Username">
    <input id="password" type="password" placeholder="Password (8+ characters)">
    <button id="login-btn">Log in</button>
    <button id="register-btn">Register</button>
  </div>

  <div id="app-section" class="hidden">
  <button id="logout-btn">Log out</button>

  <h2>Add a book</h2>
  <input id="title" placeholder="Title">
  <input id="author" placeholder="Author">
  <button id="add-btn">Add book</button>

  <h2>My books</h2>
  <ul id="book-list"></ul>
</div>

  <script>
    const messageEl = document.getElementById("message");
    const authSection = document.getElementById("auth-section");
    const appSection = document.getElementById("app-section");

    function showMessage(text) {
      messageEl.textContent = text;
    }

    function getToken() {
      return localStorage.getItem("token");
    }

    function updateView() {
  const loggedIn = getToken() !== null;
  authSection.classList.toggle("hidden", loggedIn);
  appSection.classList.toggle("hidden", !loggedIn);
  if (loggedIn) {
    loadBooks();
  }
    }

    function errorText(data) {
      if (typeof data.detail === "string") return data.detail;
      if (Array.isArray(data.detail)) return data.detail.map(d => d.msg).join(", ");
      return "Something went wrong";
    }

    async function register() {
      const username = document.getElementById("username").value;
      const password = document.getElementById("password").value;

      const response = await fetch("/register", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ username, password }),
      });
      const data = await response.json();

      if (response.ok) {
        showMessage("Registered! Now log in.");
      } else {
        showMessage(errorText(data));
      }
    }

    async function login() {
      const username = document.getElementById("username").value;
      const password = document.getElementById("password").value;

      const response = await fetch("/login", {
        method: "POST",
        body: new URLSearchParams({ username, password }),
      });
      const data = await response.json();

      if (response.ok) {
        localStorage.setItem("token", data.access_token);
        showMessage("");
        updateView();
      } else {
        showMessage(errorText(data));
      }
    }

    function logout() {
      localStorage.removeItem("token");
      updateView();
    }

async function authFetch(url, options = {}) {
  const response = await fetch(url, {
    ...options,
    headers: {
      ...options.headers,
      Authorization: "Bearer " + getToken(),
    },
  });
  if (response.status === 401) {
    logout();
    showMessage("Session expired. Please log in again.");
  }
  return response;
}

async function loadBooks() {
  const response = await authFetch("/books");
  if (!response.ok) return;
  const books = await response.json();

  const list = document.getElementById("book-list");
  list.replaceChildren();

  if (books.length === 0) {
    const li = document.createElement("li");
    li.textContent = "No books yet.";
    list.appendChild(li);
    return;
  }

  for (const book of books) {
    const li = document.createElement("li");
    li.textContent = book.title + " by " + book.author + (book.read ? " (read)" : "");

    const readBtn = document.createElement("button");
    readBtn.textContent = book.read ? "Mark unread" : "Mark read";
    readBtn.addEventListener("click", () => toggleRead(book.id, !book.read));

    const deleteBtn = document.createElement("button");
    deleteBtn.textContent = "Delete";
    deleteBtn.addEventListener("click", () => deleteBook(book.id));

    li.appendChild(readBtn);
    li.appendChild(deleteBtn);
    list.appendChild(li);
  }
}

async function addBook() {
  const title = document.getElementById("title").value;
  const author = document.getElementById("author").value;

  const response = await authFetch("/books", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ title, author }),
  });
  if (response.status === 401) return;

  if (response.ok) {
    document.getElementById("title").value = "";
    document.getElementById("author").value = "";
    showMessage("");
    loadBooks();
  } else {
    const data = await response.json();
    showMessage(errorText(data));
  }
}

async function toggleRead(id, newValue) {
  const response = await authFetch("/books/" + id, {
    method: "PUT",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ read: newValue }),
  });
  if (response.status === 401) return;

  if (response.ok) {
    loadBooks();
  } else {
    const data = await response.json();
    showMessage(errorText(data));
  }
}

async function deleteBook(id) {
  if (!confirm("Delete this book?")) return;

  const response = await authFetch("/books/" + id, { method: "DELETE" });
  if (response.status === 401) return;

  if (response.ok) {
    loadBooks();
  } else {
    const data = await response.json();
    showMessage(errorText(data));
  }
}

    document.getElementById("register-btn").addEventListener("click", register);
    document.getElementById("login-btn").addEventListener("click", login);
    document.getElementById("logout-btn").addEventListener("click", logout);
    document.getElementById("add-btn").addEventListener("click", addBook);

    updateView();
  </script>
</body>
</html>
